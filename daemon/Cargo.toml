[package]
name = "framework-kcmd"
version = "0.1.0"
description = "System D-Bus service exposing Framework Laptop EC controls to the Framework KCM"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
framework_lib = { git = "https://github.com/FrameworkComputer/framework-system", tag = "v0.6.6" }
# Same major as framework_lib, needed to read SMBIOS structures it hands back
dmidecode = { version = "1", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zbus_polkit = { version = "5", default-features = false, features = ["tokio"] }
# For ValueEnum::from_str on framework_lib's argument enums; same version it uses
clap = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
strip = true
lto = "thin"
