<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.frameworkkcm.Daemon1"/>
  </policy>

  <!-- Anyone may talk to it; writes are gated by polkit inside the daemon -->
  <policy context="default">
    <allow send_destination="io.github.frameworkkcm.Daemon1"/>
  </policy>
</busconfig>
